<!--
  WagerPals mark — white chevrons, gold coin. Same glyph as mark.svg; this is
  the `tone="inverse"` treatment from components/Logo.tsx.

  This is the variant that sits on the blue brand tile (favicons, PWA icons and
  the mobile app icon), so the chevrons go solid white and only the coin keeps
  its colour. See mark.svg for why the wrapper offset is -0.5.
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wpMarkCoin" x1="26" y1="10" x2="38" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,-0.5)">
    <path d="M6,13 L18,52 L32,21" fill="none" stroke="#ffffff" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32,21 L46,52 L58,13" fill="none" stroke="#ffffff" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="15" r="5.9" fill="url(#wpMarkCoin)"/>
  </g>
</svg>
