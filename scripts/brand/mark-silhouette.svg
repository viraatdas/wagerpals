<!--
  WagerPals mark — flat single-colour silhouette.

  THIS FILE AND components/Logo.tsx MUST DRAW THE SAME GLYPH.
  Logo.tsx is the on-screen mark; this file is what scripts/generate-brand-assets.ts
  rasterizes into every favicon, PWA icon, OG card and mobile app icon. The circle,
  the half-disc path and the seam below are copied verbatim from LogoMark in
  components/Logo.tsx — change one and you must change the other, or the header
  and the installed app icon stop being the same logo.

  The glyph: two sides of the same coin. One disc cut by a diagonal seam, the
  near half solid and the far half an open ring. There is deliberately NO letter
  W; scripts/verify-brand.ts fails if a second <path> ever reappears.

  Ink spans 11..53 on both axes (a disc of r=21 about the centre), so the glyph
  is already centred in the 64-unit viewBox and needs no wrapper offset. The
  generator centres artwork by viewBox, not ink bounds.

  Android notification icons are rendered from the alpha channel alone. This
  glyph survives that masking precisely because the seam between the two halves
  is a real hole in the alpha channel rather than a colour difference.
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="wpMarkSeam" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <rect x="29.7" y="2" width="4.6" height="60" fill="#000"/>
    </mask>
  </defs>
  <g transform="rotate(-20 32 32)">
    <g mask="url(#wpMarkSeam)">
      <circle cx="32" cy="32" r="17.5" fill="none" stroke="#ffffff" stroke-width="7"/>
      <path d="M32,11 A21,21 0 0,0 32,53 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
